[package]
name = "p4-lsp"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Language Server Protocol implementation for P4"

[[bin]]
name = "p4-lsp"
path = "src/main.rs"

[dependencies]
p4 = { path = "../p4/p4" }
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "6"
ropey = "1"
log = "0.4"
env_logger = "0.11"
